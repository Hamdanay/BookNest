services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booknest-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      # Data SQLite dan uploads disimpan di Docker Volume agar tidak hilang saat container restart
      - booknest-data:/app/data
      - booknest-uploads:/app/uploads
    logging:
      # Mencegah disk penuh: Log dibatasi maksimal 10 MB per file, simpan 3 file rotasi
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Cek kesehatan API setiap 20 detik langsung ke endpoint /api/health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - booknest-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booknest-frontend
    restart: unless-stopped
    ports:
      # Akses aplikasi lewat http://localhost:8080
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy # Frontend hanya jalan jika backend sudah terbukti sehat
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Cek kesehatan Web Server Nginx
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - booknest-net

  # ==============================================================
  # STACK MONITORING (cAdvisor + Prometheus + Grafana)
  # ==============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: booknest-cadvisor
    restart: unless-stopped
    # Port 8085 digunakan agar tidak bentrok dengan frontend BookNest di port 8080
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - booknest-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: booknest-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # UI Prometheus untuk ad-hoc PromQL query
      - "9090:9090"
    networks:
      - booknest-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: booknest-grafana
    restart: unless-stopped
    ports:
      # Dashboard visual Grafana
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/booknest-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - booknest-net

volumes:
  booknest-data:
  booknest-uploads:
  prometheus-data:
  grafana-data:

networks:
  booknest-net:
    driver: bridge
