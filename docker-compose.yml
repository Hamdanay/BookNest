services:
  # ==============================================================
  # 1. DATABASE SERVICE (PostgreSQL 16 Multi-Tier Container)
  # ==============================================================
  db:
    image: postgres:16-alpine
    container_name: booknest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booknest}
      POSTGRES_USER: ${POSTGRES_USER:-booknest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booknest_pass}
    volumes:
      # Data persisten disimpan di named volume agar tidak hilang saat container restart
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # Uji kesiapan koneksi database PostgreSQL sebelum backend diizinkan aktif
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booknest_user} -d ${POSTGRES_DB:-booknest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - booknest-net

  # ==============================================================
  # 2. BACKEND API SERVICE (Express.js Multi-Stage Container)
  # ==============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booknest-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-booknest}
      - DB_USER=${POSTGRES_USER:-booknest_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-booknest_pass}
    volumes:
      - booknest-data:/app/data
      - booknest-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy # Backend hanya jalan setelah database terbukti sehat
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - booknest-net

  # ==============================================================
  # 3. FRONTEND WEB SERVICE (React SPA + Nginx Reverse Proxy)
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booknest-frontend
    restart: unless-stopped
    ports:
      # Akses aplikasi utama melalui http://localhost:8080
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy # Frontend hanya jalan jika backend sudah terbukti sehat
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - booknest-net

  # ==============================================================
  # 4. TOOLS PROFILE SERVICE (Database Management UI - Adminer)
  # ==============================================================
  adminer:
    image: adminer:4.8.1
    container_name: booknest-adminer
    restart: unless-stopped
    profiles:
      - tools # Hanya aktif jika dipanggil dengan flag --profile tools
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - booknest-net

  # ==============================================================
  # 5. OBSERVABILITY STACK (Prometheus + Grafana + cAdvisor)
  # ==============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: booknest-cadvisor
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - booknest-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: booknest-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - booknest-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: booknest-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/booknest-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - booknest-net

# ==============================================================
# PERSISTENT STORAGE (Named Volumes)
# ==============================================================
volumes:
  postgres-data:
  booknest-data:
  booknest-uploads:
  prometheus-data:
  grafana-data:

# ==============================================================
# USER-DEFINED ISOLATED BRIDGE NETWORK
# ==============================================================
networks:
  booknest-net:
    driver: bridge
